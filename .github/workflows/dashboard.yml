name: Pirates 7 bijwerken

# De code staat in github.com/basvanderlit1-commits/dv-the-pirates (clubsite).
# Deze repo bouwt daarmee alleen het dashboard van Pirates 7, zodat de oude link blijft werken.
# Meldingen (ook pirates7-dbmn-uitslagen) verstuurt de clubsite; hier niet, anders komen ze dubbel.

on:
  schedule:
    - cron: "10 5 * * *"
    - cron: "40 22 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write           # keep-alive: workflow opnieuw inschakelen

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: basvanderlit1-commits/dv-the-pirates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape.py --team "Pirates 7" --solo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Keep-alive (GitHub schakelt geplande workflows uit na 60 dagen zonder commits)
        run: gh workflow enable dashboard.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
